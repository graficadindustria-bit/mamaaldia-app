<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#F2E4DA" media="(prefers-color-scheme: light)"><meta name="theme-color" content="#211A17" media="(prefers-color-scheme: dark)">
<meta name="description" content="Mamá al Día: escribe como te salga y Lía te ordena agenda, medicamentos, menú y compras. Versión de prueba.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="favicon.png?v=4">
<link rel="apple-touch-icon" href="apple-touch-icon.png?v=4">
<meta name="apple-mobile-web-app-capable" content="yes">

<title>Mamá al Día</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
[hidden]{display:none!important}
:root{
  --bg:#F2E4DA; --surface:#FDF8F4; --surface2:#F8EEE7; --line:#E3CFC2; --ink:#3E302A; --sub:#7A645A;
  --accent:#A5634F; --accent2:#B87866; --onaccent:#FFFFFF; --asoft:#F1D9CE;
  --sage:#3F7154; --sagesoft:#DDEEE2; --sun:#8F5E12; --sunsoft:#F8EAD2; --lilac:#6A5A9C; --lilacsoft:#ECE7F7;
  --danger:#A83232; --dangersoft:#FBE4E2; --shadow:rgba(94,75,66,.16);
  --f:'Nunito',system-ui,-apple-system,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#211A17; --surface:#2C2320; --surface2:#332926; --line:#47382F; --ink:#F2E4DA; --sub:#C2ADA2;
  --accent:#E2A28C; --accent2:#E2A28C; --onaccent:#2B1810; --asoft:#4C3129;
  --sage:#8CC7A3; --sagesoft:#22382B; --sun:#F2C46E; --sunsoft:#3D3020; --lilac:#BDB0EA; --lilacsoft:#312B45;
  --danger:#F2A3A0; --dangersoft:#4A2423; --shadow:rgba(0,0,0,.5); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#211A17; --surface:#2C2320; --surface2:#332926; --line:#47382F; --ink:#F2E4DA; --sub:#C2ADA2;
  --accent:#E2A28C; --accent2:#E2A28C; --onaccent:#2B1810; --asoft:#4C3129;
  --sage:#8CC7A3; --sagesoft:#22382B; --sun:#F2C46E; --sunsoft:#3D3020; --lilac:#BDB0EA; --lilacsoft:#312B45;
  --danger:#F2A3A0; --dangersoft:#4A2423; --shadow:rgba(0,0,0,.5); color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 var(--f);-webkit-tap-highlight-color:transparent}
h1,h2,h3{margin:0;font-weight:800;text-wrap:balance}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.app{max-width:480px;margin:0 auto;min-height:100%;position:relative;padding-bottom:calc(84px + env(safe-area-inset-bottom,0px))}
header.top{position:sticky;top:0;z-index:5;background:var(--bg);display:flex;align-items:center;gap:10px;padding:calc(10px + env(safe-area-inset-top,0px)) 16px 10px}
.brand{display:flex;align-items:center;gap:8px;font-weight:800;font-size:17px}
.brand img{width:30px;height:30px;border-radius:8px}
.top .sp{flex:1}
.iconbtn{border:0;background:var(--surface);border:1px solid var(--line);width:40px;height:40px;border-radius:12px;display:grid;place-items:center}
.iconbtn svg{width:20px;height:20px}
main{padding:4px 16px 16px}
.view{display:none}.view.on{display:block}
.card{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:14px;margin:0 0 12px}
.muted{color:var(--sub)}.small{font-size:13px}.tiny{font-size:12px}
.row{display:flex;align-items:center;gap:10px}
.between{justify-content:space-between}
.sect{display:flex;align-items:baseline;justify-content:space-between;margin:18px 2px 8px}
.sect h2{font-size:17px}
.btn{border:0;border-radius:14px;padding:12px 16px;font-weight:800;background:var(--accent);color:var(--onaccent);min-height:46px}
.btn.ghost{background:var(--surface);color:var(--ink);border:1px solid var(--line)}
.btn.soft{background:var(--asoft);color:var(--accent)}
.btn.sm{min-height:36px;padding:7px 12px;border-radius:11px;font-size:14px}
.btn.block{width:100%}
.chip{display:inline-flex;align-items:center;gap:5px;border-radius:999px;padding:3px 10px;font-size:12.5px;font-weight:700;background:var(--asoft);color:var(--accent)}
.c-salud{background:var(--sagesoft);color:var(--sage)}
.c-clase{background:var(--lilacsoft);color:var(--lilac)}
.c-familia{background:var(--sunsoft);color:var(--sun)}
.c-mama{background:var(--asoft);color:var(--accent)}
.c-comida{background:var(--sunsoft);color:var(--sun)}
.c-med{background:var(--sagesoft);color:var(--sage)}
.c-tarea{background:var(--surface2);color:var(--sub);border:1px solid var(--line)}
.hello h1{font-size:25px}
.ask{display:flex;gap:8px;align-items:center;background:var(--surface);border:1.5px solid var(--accent);border-radius:16px;padding:6px 6px 6px 14px;margin:12px 0 4px}
.ask input{flex:1;border:0;background:transparent;outline:0;min-width:0;padding:8px 0}
.ask button{border:0;background:var(--accent);color:var(--onaccent);border-radius:12px;width:42px;height:42px;display:grid;place-items:center;flex:none}
.ask button svg{width:20px;height:20px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:12px 0}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:10px 12px}
.stat b{font-size:22px;display:block;line-height:1.1}
.tl{list-style:none;margin:0;padding:0}
.tl li{display:flex;gap:12px;align-items:flex-start;padding:10px 0;border-top:1px solid var(--line)}
.tl li:first-child{border-top:0}
.tl .t{width:48px;flex:none;font-weight:800;font-variant-numeric:tabular-nums;padding-top:2px}
.tl .b{flex:1;min-width:0}
.tl .ttl{font-weight:700}
.tl li.done .ttl{text-decoration:line-through;color:var(--sub)}
.tl li.now{background:var(--asoft);margin:0 -14px;padding:10px 14px;border-radius:12px;border-top-color:transparent}
.check{flex:none;width:28px;height:28px;border-radius:9px;border:2px solid var(--line);background:var(--surface);display:grid;place-items:center;padding:0}
.check.on{background:var(--sage);border-color:var(--sage);color:var(--surface)}
.check svg{width:16px;height:16px}
.alert{background:var(--sagesoft);border:1px solid var(--sage);border-radius:16px;padding:12px 14px;margin:0 0 10px;display:flex;gap:10px;align-items:center}
.alert.ev{background:var(--asoft);border-color:var(--accent)}
.alert .b{flex:1}
.med{display:flex;gap:12px;align-items:center}
.ring{width:54px;height:54px;flex:none;border-radius:50%;display:grid;place-items:center;font-weight:800;font-size:13px;background:conic-gradient(var(--sage) calc(var(--p)*1%),var(--sagesoft) 0);position:relative}
.ring span{background:var(--surface);width:42px;height:42px;border-radius:50%;display:grid;place-items:center;text-align:center;line-height:1.05}
.note{background:var(--sunsoft);color:var(--ink);border-radius:14px;padding:10px 12px;font-size:13px;margin:0 0 12px}
.note b{color:var(--sun)}
.danger-note{background:var(--dangersoft);border-radius:14px;padding:10px 12px;font-size:13px;margin:0 0 12px}
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
nav.tabs .in{max-width:480px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr);align-items:stretch;height:62px}
nav.tabs button{border:0;background:transparent;padding:0;height:62px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font-size:11.5px;font-weight:700;color:var(--sub)}
nav.tabs button svg{width:23px;height:23px}
nav.tabs button.on{color:var(--accent)}
nav.tabs .lia{position:relative;justify-content:flex-end;padding-bottom:9px}
canvas.orb{width:100%;height:100%;display:block}
nav.tabs .lia .face{position:absolute;left:50%;top:-22px;transform:translateX(-50%);width:56px;height:56px;border-radius:50%;background:var(--surface);display:grid;place-items:center;box-shadow:0 6px 16px var(--shadow);border:4px solid var(--surface)}
.face svg{width:100%;height:100%}
/* chat */
.chatwrap{display:flex;flex-direction:column;min-height:calc(100vh - 170px)}
.msgs{flex:1;display:flex;flex-direction:column;gap:10px;padding-bottom:12px}
.msg{max-width:88%;padding:10px 13px;border-radius:18px;white-space:pre-wrap;word-wrap:break-word}
.msg.me{align-self:flex-end;background:var(--accent);color:var(--onaccent);border-bottom-right-radius:6px}
.msg.lia{align-self:flex-start;background:var(--surface);border:1px solid var(--line);border-bottom-left-radius:6px}
.lia-row{display:flex;gap:8px;align-items:flex-end}
.lia-row .av{width:32px;height:32px;flex:none;border-radius:50%}
.org{display:flex;flex-direction:column;gap:6px;margin-top:8px;white-space:normal}
.org .it{display:flex;gap:8px;align-items:flex-start;background:var(--surface2);border:1px solid var(--line);border-radius:12px;padding:8px 10px;font-size:14px}
.org .it .chip{flex:none}
.undo{margin-top:8px;border:0;background:transparent;color:var(--sub);font-size:13px;font-weight:700;text-decoration:underline;padding:4px 0}
.composer{position:sticky;bottom:calc(84px + env(safe-area-inset-bottom,0px));background:var(--bg);padding:8px 0 4px}
.composer .ask{margin:0}
.mic.rec{background:var(--danger)!important;animation:pulse 1s infinite}
.mic{touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
.ask button.cam{background:transparent;color:var(--accent);width:34px;margin-left:-8px}
.pimg{display:flex;align-items:center;gap:10px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:6px 8px;margin-bottom:6px}
.pimg img{width:46px;height:46px;object-fit:cover;border-radius:10px}.pimg span{flex:1;font-size:13px;color:var(--muted)}.pimg button{border:0;background:var(--line);border-radius:10px;width:32px;height:32px}
.mimg{display:block;max-width:180px;width:100%;border-radius:12px;margin-bottom:6px}
.msg.guia{max-width:94%}.gtag{display:inline-block;font-size:12px;font-weight:700;color:var(--sage);margin-bottom:6px}
.gnote{margin-top:10px;font-size:12px;color:var(--muted);border-top:1px solid var(--line);padding-top:8px}.gsrc{margin-top:6px;font-size:12px;color:var(--muted)}.gsrc a{color:var(--accent)}
.mes{padding:4px 12px}.mrow{display:flex;gap:12px;padding:10px 0;border-bottom:1px solid var(--line)}.mrow:last-child{border-bottom:0}
.mrow .md{width:38px;flex:none;text-align:center;font-size:12px;color:var(--muted)}.mrow .md b{display:block;font-size:17px;color:var(--ink)}.mrow.today .md b{color:var(--accent)}
.mrow .mm{flex:1;min-width:0;font-size:14px;display:flex;flex-direction:column;gap:2px}
.lug{padding:0;overflow:hidden}.lug .lb{padding:12px 14px}.lfoto{display:block;width:100%;height:170px;object-fit:cover;background:var(--line)}
.recbar{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(150px + env(safe-area-inset-bottom,0px));width:min(560px,calc(100% - 24px));background:var(--surface);border:1.5px solid var(--danger);border-radius:18px;padding:10px 12px;display:flex;align-items:center;gap:10px;box-shadow:0 8px 24px var(--shadow);z-index:60}
.recbar .dot{width:12px;height:12px;border-radius:50%;background:var(--danger);animation:pulse 1s infinite;flex:none}
.recbar .tm{font-variant-numeric:tabular-nums;font-weight:700;flex:none}
.recbar .hint{flex:1;min-width:0;font-size:13px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.recbar.wait .dot{background:var(--muted);animation:none}.recbar.cancel{border-color:var(--muted)}.recbar.cancel .hint{color:var(--danger)}
.recbar button{border:0;border-radius:12px;height:38px;padding:0 12px;font-weight:600;flex:none}
.recbar .x{background:var(--line);color:var(--ink)}.recbar .ok{background:var(--accent);color:var(--onaccent)}
.typing span{display:inline-block;width:7px;height:7px;margin:0 2px;border-radius:50%;background:var(--muted);animation:blink 1.2s infinite}
.typing span:nth-child(2){animation-delay:.2s}.typing span:nth-child(3){animation-delay:.4s}
@keyframes blink{0%,80%,100%{opacity:.25;transform:translateY(0)}40%{opacity:1;transform:translateY(-3px)}}
@keyframes bobc{from{transform:translateX(-50%)}to{transform:translateX(-50%) translateY(-4px) scale(1.04)}}
@keyframes bob{to{transform:translateY(-4px) scale(1.04)}}
.aibadge{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:600;border-radius:999px;padding:2px 8px;background:var(--accent2);color:var(--ink)}
@keyframes pulse{50%{opacity:.6}}
.sugs{display:flex;gap:6px;overflow-x:auto;padding:2px 0 8px;scrollbar-width:none}
.sugs button{flex:none;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 12px;font-size:13px;font-weight:600}
/* agenda */
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin:8px 0 12px}
.week button{border:1px solid var(--line);background:var(--surface);border-radius:14px;padding:7px 0;display:flex;flex-direction:column;align-items:center;font-size:11.5px;font-weight:700;color:var(--sub);position:relative}
.week button b{font-size:17px;color:var(--ink)}
.week button.on{background:var(--accent);border-color:var(--accent);color:var(--onaccent)}
.week button.on b{color:var(--onaccent)}
.week button.today:not(.on){border-color:var(--accent)}
.week i{position:absolute;bottom:4px;width:5px;height:5px;border-radius:50%;background:var(--accent)}
.week button.on i{background:var(--onaccent)}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(max-content,1fr);overflow-x:auto;scrollbar-width:none;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:4px;gap:4px;margin:6px 0 12px}
.seg button{border:0;background:transparent;border-radius:10px;padding:8px 4px;font-weight:800;font-size:14px;color:var(--sub)}
.seg button.on{background:var(--asoft);color:var(--accent)}
.meal{display:flex;gap:12px;padding:10px 0;border-top:1px solid var(--line)}
.meal:first-child{border-top:0}
.meal .t{width:48px;flex:none;font-weight:800;font-variant-numeric:tabular-nums}
.meal .k{font-size:12px;font-weight:800;text-transform:uppercase;letter-spacing:.04em;color:var(--sun)}
.meal .n{font-weight:800}
.meal .swap{border:0;background:transparent;color:var(--accent);font-weight:800;font-size:13px;padding:4px 0}
.bar{height:10px;background:var(--line);border-radius:99px;overflow:hidden;margin:8px 0 4px}
.bar i{display:block;height:100%;background:var(--sage);border-radius:99px}
.bar.over i{background:var(--danger)}
.shop{list-style:none;margin:0;padding:0}
.shop li{display:flex;gap:10px;align-items:center;padding:9px 0;border-top:1px solid var(--line)}
.shop li:first-child{border-top:0}
.shop li .n{flex:1}
.shop li.on .n{text-decoration:line-through;color:var(--sub)}
.shop .p{font-variant-numeric:tabular-nums;color:var(--sub);font-size:13px;border:0;background:transparent;padding:4px}
.grp{font-size:12px;font-weight:800;text-transform:uppercase;letter-spacing:.05em;color:var(--sub);margin:4px 0 2px}
.fab{position:fixed;right:max(16px,calc(50% - 224px));bottom:calc(96px + env(safe-area-inset-bottom,0px));z-index:5;border-radius:16px;box-shadow:0 8px 20px var(--shadow)}
label.f{display:block;font-weight:700;font-size:13px;margin:10px 0 4px}
.inp{width:100%;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:11px 12px;min-height:44px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chips label{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:999px;padding:6px 12px;background:var(--surface);font-weight:600;font-size:14px}
.chips input{accent-color:var(--accent)}
dialog{border:0;border-radius:22px;padding:0;width:min(440px,calc(100vw - 24px));background:var(--surface);color:var(--ink);box-shadow:0 20px 50px rgba(0,0,0,.3)}
dialog::backdrop{background:rgba(30,15,10,.45)}
dialog .in{padding:18px;max-height:85vh;overflow:auto}
dialog h3{font-size:19px;margin-bottom:4px}
.dlg-act{display:flex;gap:8px;margin-top:16px}
.dlg-act .btn{flex:1}
.toast{position:fixed;left:50%;bottom:calc(100px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-weight:700;z-index:50;max-width:90vw}
/* welcome */
.welcome{min-height:100vh;display:flex;flex-direction:column;justify-content:center;padding:28px 22px calc(28px + env(safe-area-inset-bottom,0px));max-width:480px;margin:0 auto}
.welcome .logo{width:84px;height:84px;border-radius:22px;box-shadow:0 10px 30px var(--shadow)}
.welcome h1{font-size:32px;margin:18px 0 6px}
.welcome p{font-size:16px;color:var(--sub);margin:0 0 6px}
.feat{display:flex;gap:10px;align-items:flex-start;margin:10px 0}
.feat .ic{width:36px;height:36px;border-radius:12px;display:grid;place-items:center;flex:none;font-size:18px}
.empty{text-align:center;color:var(--sub);padding:14px 6px;font-size:14px}
.install{display:flex;gap:10px;align-items:center;background:var(--asoft);border-radius:16px;padding:10px 12px;margin:0 0 12px}
.install .b{flex:1;font-size:13.5px}
.msg.typing .slow{display:none;font-style:normal;font-size:13px;color:var(--muted);margin-left:8px}.msg.typing.long .slow{display:inline}</style>
</head>

<script>
'use strict';
/* ====================== utilidades ====================== */
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const norm=s=>String(s||'').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'');
const uid=()=>Math.random().toString(36).slice(2,9);
const DAYN=['domingo','lunes','martes','miercoles','jueves','viernes','sabado'];
const DAYS=['Domingo','Lunes','Martes','Miércoles','Jueves','Viernes','Sábado'];
const DSH=['Dom','Lun','Mar','Mié','Jue','Vie','Sáb'];
const MON=['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];
const pad=n=>String(n).padStart(2,'0');
const ymd=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const hm=d=>pad(d.getHours())+':'+pad(d.getMinutes());
const fromYmd=s=>{const [y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d)};
const at=(dateStr,time)=>{const d=fromYmd(dateStr);if(time){const [h,m]=time.split(':').map(Number);d.setHours(h,m,0,0)}return d};
const addDays=(d,n)=>{const x=new Date(d);x.setDate(x.getDate()+n);return x};
const startDay=d=>{const x=new Date(d);x.setHours(0,0,0,0);return x};
const cap=s=>s?s.charAt(0).toUpperCase()+s.slice(1):s;
const fmtDate=d=>DAYS[d.getDay()]+' '+d.getDate()+' de '+MON[d.getMonth()];
const bs=n=>'Bs '+(Math.round(n*10)/10).toLocaleString('es-BO',{maximumFractionDigits:1});
function rel(ts){const m=Math.round((ts-Date.now())/60000);if(Math.abs(m)<1)return 'ahora';const a=Math.abs(m);let s=a<60?a+' min':a<1440?(Math.floor(a/60)+' h'+(a%60?' '+(a%60)+' min':'')):Math.round(a/1440)+' días';return m>0?'en '+s:'hace '+s}
function toast(t){const e=$('#toast');e.textContent=t;e.hidden=false;clearTimeout(toast.t);toast.t=setTimeout(()=>e.hidden=true,2600)}
const IC={
 cam:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"><path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13" r="3.5"/></svg>',

function weekStart(d=new Date()){const x=startDay(d);const dw=(x.getDay()+6)%7;return addDays(x,-dw)}
function makeMenu(seed){
 const R=rnd(seed||Date.now());
 const pool=k=>{const a=REC.filter(r=>r.k===k&&okRec(r));for(let i=a.length-1;i>0;i--){const j=Math.floor(R()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
 const P={d:pool('d'),s:pool('s'),a:pool('a').filter(r=>!r.cheap),c:pool('c').filter(r=>!r.cheap)};
 const days=[];
 for(let i=0;i<7;i++){const day={};let si=0;
  for(const [id,,,k] of SLOTS){const arr=P[k];if(!arr.length){day[id]=null;continue}
   if(k==='s'){day[id]=arr[(i*2+si)%arr.length].id;si++}else day[id]=arr[i%arr.length].id}
  days.push(day)}
 S.menu={week:ymd(weekStart()),days,seed};
 fitBudget();S.shopChecked={};
}

 if(S.plan)for(const k of Object.keys(S.plan))if(k<cw)delete S.plan[k];save()}
function menuCost(){if(!S.menu)return 0;return shopList().reduce((a,x)=>a+x.cost,0)}
function fitBudget(){
 const b=Number(S.profile.budget)||0;if(!b||!S.menu)return;let guard=0;
 const cheapC=REC.filter(r=>r.k==='c'&&okRec(r)).sort((x,y)=>recCost(x)-recCost(y));
 const cheapA=REC.filter(r=>r.k==='a'&&okRec(r)).sort((x,y)=>recCost(x)-recCost(y));
 while(menuCost()>b&&guard++<20){
  // 1) cenas caras -> sobrante del almuerzo
  let best=null;
  S.menu.days.forEach((d,i)=>{const r=RECBY[d.cena];if(r&&!r.cheap&&(!best||recCost(r)>best.c))best={i,c:recCost(r),slot:'cena'}});
  const sobras=S.menu.days.filter(d=>d.cena==='c_sobra').length;
  if(best&&sobras<4){S.menu.days[best.i].cena='c_sobra';continue}
  // 2) almuerzos caros -> los más baratos
  let worst=null;S.menu.days.forEach((d,i)=>{const r=RECBY[d.almuerzo];if(r&&(!worst||recCost(r)>worst.c))worst={i,c:recCost(r)}});
  const alt=cheapA.find(r=>!S.menu.days.some(d=>d.almuerzo===r.id))||cheapA[0];
  if(worst&&alt&&recCost(alt)<worst.c){S.menu.days[worst.i].almuerzo=alt.id;continue}
  break;
 }
}

function timeRange(n){const m=/\b(?:de|desde)\s+(?:las\s+)?(\d{1,2})(?:[:.](\d{2}))?\s*(?:hs|h|am|pm)?\s+(?:a|hasta)\s+(?:las\s+)?(\d{1,2})(?:[:.](\d{2}))?\b/.exec(n);if(!m||+m[1]>23||+m[3]>23)return null;let h1=+m[1],h2=+m[3];const pmCtx=/(de|en|por) la (tarde|noche)/.test(n);if(pmCtx&&h1<12)h1+=12;if(pmCtx&&h2<12)h2+=12;if(h1>=1&&h1<=6&&!/manana/.test(n))h1+=12;if(h2<h1&&h2+12<=23)h2+=12;return {start:pad(h1)+':'+pad(m[2]?+m[2]:0),end:pad(h2)+':'+pad(m[4]?+m[4]:0)}}

 {const tr=timeRange(n);if(tr)return tr.start}

 else if((m=/\b(\d{1,2}):(\d{2})\s*(am|pm|hs)?\b/.exec(n))){h=+m[1];mi=+m[2];ap=m[3]}
 else if((m=/\b(\d{1,2})\s*(am|pm|hs|hrs)\b/.exec(n))){h=+m[1];ap=m[2]}
 if(h==null||h>23)return null;

function eventsOn(ds){const dw=fromYmd(ds).getDay();return S.events.filter(e=>e.recur?(e.recur.includes(dw)&&(!e.created||e.created<=ds)):e.date===ds).sort((a,b)=>(a.time||'99').localeCompare(b.time||'99'))}
function medEnd(m){return m.days?m.start+m.days*864e5:Infinity}
function medNext(m){const last=m.given.length?Math.max(...m.given):null;const nx=last?last+m.every*36e5:m.start;return nx>=medEnd(m)?null:nx}
function medActive(m){return !m.stopped&&medNext(m)!==null}
function medDosesOn(m,ds){const d0=fromYmd(ds).getTime(),d1=d0+864e5;const res=[];
 for(const g of m.given)if(g>=d0&&g<d1)res.push({t:g,done:true});
 let nx=medNext(m);if(m.stopped)nx=null;while(nx&&nx<d1&&nx<medEnd(m)){if(nx>=d0)res.push({t:nx,done:false});nx+=m.every*36e5}
 return res.sort((a,b)=>a.t-b.t)}
function dayItems(ds){const items=[];
 for(const e of eventsOn(ds))items.push({time:e.time,type:'ev',cat:e.cat,title:e.title+(e.end?' (hasta '+e.end+')':''),sub:{salud:'Salud',clase:'Clase',familia:'Familia y amigos',mama:'Para ti'}[e.cat]+(e.who==='kid'&&kidName(kidOf(e))?' · '+kidName(kidOf(e)):''),id:e.id});
 for(const m of S.meds)for(const d of medDosesOn(m,ds))items.push({time:hm(new Date(d.t)),type:'med',cat:'med',title:m.name+(m.dose?' · '+m.dose:''),sub:d.done?'Dosis dada':'Dosis'+(m.forKid&&kidName(kidOf(m))?' de '+kidName(kidOf(m)):''),done:d.done,id:m.id,ts:d.t});
 const md=menuDay(ds);if(md)for(const [id,lab,time] of SLOTS){const r=RECBY[md[id]];if(r)items.push({time,type:'meal',cat:'comida',title:r.n,sub:lab})}

 return items.sort((a,b)=>(a.time||'99').localeCompare(b.time||'99'))}
function menuDay(ds){if(!S.menu)return null;const w=fromYmd(S.menu.week);const i=Math.round((fromYmd(ds)-w)/864e5);return i>=0&&i<7?S.menu.days[i]:null}

const ORB={glass:'rgba(248,228,218,.5)',edge:'rgba(150,95,78,.45)',c:['#8E5442','#C27F69','#F6D3C4','#B7A3DE'],glow:'184,120,102'};
function orbWave(x,W,base,amp,t,sp,k,ph){return base+Math.sin(x/W*Math.PI*2*k+t*sp+ph)*amp+Math.sin(x/W*Math.PI*2*(k*1.7)-t*sp*0.6+ph*2)*amp*0.45}
function orbDraw(cv,s,small){
 const x=cv.getContext('2d'),W=cv.width,R=W/2,o=s.o,a=s.amp,t=s.t;
 x.clearRect(0,0,W,W);
 const pr=R*(small?0.96:0.80);
 if(!small){const g=x.createRadialGradient(R,R,pr*0.85,R,R,R);g.addColorStop(0,`rgba(${o.glow},${0.18+a*0.3})`);g.addColorStop(1,`rgba(${o.glow},0)`);x.fillStyle=g;x.fillRect(0,0,W,W)}
 x.save();x.beginPath();x.arc(R,R,pr,0,Math.PI*2);x.clip();
 // vidrio: interior casi transparente con tinte
 const gl=x.createRadialGradient(R,R-pr*0.2,pr*0.1,R,R,pr);gl.addColorStop(0,'rgba(255,255,255,.55)');gl.addColorStop(1,o.glass);x.fillStyle=gl;x.fillRect(0,0,W,W);
 // agua en toda la esfera: capas de olas que cruzan de arriba abajo y corrientes de color
 let g=x.createLinearGradient(0,R-pr,0,R+pr);g.addColorStop(0,o.c[2]);g.addColorStop(0.5,o.c[1]);g.addColorStop(1,o.c[0]);x.fillStyle=g;x.fillRect(0,0,W,W);
 o.c.forEach((col,i)=>{const sp=(0.3+i*0.12)*(1+a*1.8),ang=t*sp+i*1.9+s.phase;const cx=R+Math.cos(ang)*pr*0.45,cy=R+Math.sin(ang*1.2)*pr*0.45;const rr=pr*(0.6+a*0.25);
  const rg=x.createRadialGradient(cx,cy,0,cx,cy,rr);rg.addColorStop(0,col+'cc');rg.addColorStop(1,col+'00');x.fillStyle=rg;x.fillRect(0,0,W,W)});
 const amp=pr*(0.05+a*0.12),sp=1.2+a*4;
 for(let k=0;k<6;k++){const base=R-pr*0.95+k*pr*0.38+Math.sin(t*0.5+k)*pr*0.05;
  x.beginPath();x.moveTo(0,W);for(let px=0;px<=W;px+=W/48)x.lineTo(px,orbWave(px,W,base,amp*(0.6+k*0.12),t,sp*(k%2?1:-0.8),0.8+k*0.15,k*1.3));x.lineTo(W,W);x.closePath();
  x.fillStyle=k%2?`rgba(255,255,255,${0.10+a*0.05})`:o.c[k%3]+'33';x.fill();
  x.beginPath();for(let px=0;px<=W;px+=W/48){const y=orbWave(px,W,base,amp*(0.6+k*0.12),t,sp*(k%2?1:-0.8),0.8+k*0.15,k*1.3);px?x.lineTo(px,y):x.moveTo(px,y)}
  x.strokeStyle=`rgba(255,255,255,${0.22+a*0.2})`;x.lineWidth=Math.max(0.8,W/160);x.stroke()}
 // destellos de luz en el agua
 x.globalCompositeOperation='soft-light';
 for(let k=0;k<3;k++){const cx=R+Math.sin(t*0.5+k*2)*pr*0.5,cy=R+Math.cos(t*0.4+k*1.7)*pr*0.5;const rg=x.createRadialGradient(cx,cy,0,cx,cy,pr*0.45);rg.addColorStop(0,'#ffffff');rg.addColorStop(1,'#ffffff00');x.fillStyle=rg;x.fillRect(0,0,W,W)}
 x.globalCompositeOperation='source-over';
 if(o.face){const vw=pr*1.0,vh=pr*0.4,vx=R-vw/2,vy=R-vh/2;x.fillStyle='rgba(30,36,60,.85)';x.beginPath();x.roundRect(vx,vy,vw,vh,vh/2);x.fill();
  const blink=(Math.sin(t*0.8)>0.985)?0.15:1;x.fillStyle='#9FF0D0';[-1,1].forEach(sx=>{x.beginPath();x.ellipse(R+sx*vw*0.22,vy+vh/2,vh*0.17,vh*0.2*blink*(1+a*0.25),0,0,Math.PI*2);x.fill()})}
 // vidrio: borde y reflejos
 const rim=x.createRadialGradient(R,R,pr*0.82,R,R,pr);rim.addColorStop(0,'rgba(255,255,255,0)');rim.addColorStop(1,'rgba(255,255,255,.55)');x.fillStyle=rim;x.fillRect(0,0,W,W);
 x.restore();
 x.beginPath();x.arc(R,R,pr,0,Math.PI*2);x.strokeStyle=o.edge;x.lineWidth=Math.max(1,W/110);x.stroke();
 x.beginPath();x.ellipse(R-pr*0.38,R-pr*0.5,pr*0.26,pr*0.12,-0.6,0,Math.PI*2);x.fillStyle='rgba(255,255,255,.7)';x.fill();}

let orbT=Math.random()*50,orbAmp=0,orbLast=0,liaAn=null,liaBuf=null;
function orbLevel(){if(!document.body.classList.contains('lia-talk'))return 0;
 if(liaAn&&vozSrc){if(!liaBuf)liaBuf=new Uint8Array(liaAn.fftSize);liaAn.getByteTimeDomainData(liaBuf);let q=0;for(let i=0;i<liaBuf.length;i++){const v=(liaBuf[i]-128)/128;q+=v*v}return Math.min(1,Math.sqrt(q/liaBuf.length)*4.5)}
 const t=orbT*1.3;return Math.min(1,(Math.max(0,Math.sin(t*11))*Math.max(0,Math.sin(t*2.3+1))+0.35*Math.max(0,Math.sin(t*17.3)))*(Math.sin(t*0.9)>-0.55?1:0.1))}
const orbSlow=matchMedia('(prefers-reduced-motion: reduce)').matches?0.35:1;
function orbLoop(now){requestAnimationFrame(orbLoop);if(document.hidden)return;const dt=Math.min(0.05,(now-(orbLast||now))/1000)*orbSlow;orbLast=now;
 const tg=orbLevel();orbAmp+=(tg-orbAmp)*(tg>orbAmp?0.35:0.12);orbT+=dt*(1+orbAmp*1.5);
 const st={o:ORB,amp:orbAmp,t:orbT,phase:0};
 document.querySelectorAll('canvas.orb').forEach(cv=>{const live=cv.closest('.face,.hi');if(!live){if(cv.dataset.d)return;cv.dataset.d=1;orbDraw(cv,{o:ORB,amp:0,t:orbT,phase:0},true);return}orbDraw(cv,st,true)})}

function liaVoice(){let vs=[];try{vs=speechSynthesis.getVoices().filter(v=>/^es/i.test(v.lang))}catch(e){}
 const sc=v=>(/natural|neural|premium|enhanced|mejorad/i.test(v.name)?4:0)+(/paulina|m[oó]nica|marisol|ang[eé]lica|sabina|dalia|elena|helena|laura|luciana|francisca|camila|valentina|paloma|lupe|isabela|female|mujer/i.test(v.name)?3:0)+(/google/i.test(v.name)?1:0)+(/es[-_](419|MX|US|BO|AR|CO|PE|CL|EC|UY)/i.test(v.lang)?2:0)-(/jorge|diego|juan|carlos|pablo|enrique|alvaro|raul|male|hombre/i.test(v.name)?6:0);

 try{if(vozSrc)vozSrc.stop()}catch(e){}const src=a.createBufferSource();const g=a.createGain();g.gain.value=.95;src.buffer=buf;if(!liaAn||liaAn.context!==a){liaAn=a.createAnalyser();liaAn.fftSize=512;liaAn.connect(a.destination);liaBuf=null}src.connect(g).connect(liaAn);vozSrc=src;

 <div class="tiny muted" style="margin:0 4px 8px">Ej.: "a ${esc(S.profile.kid||'la niña')} le dio fiebre, paracetamol 5 ml cada 6 h"</div>
 ${al.map(a=>`<div class="alert ${a.kind==='med'?'':'ev'}"><div class="b"><b>${esc(a.title)}</b><div class="small muted">${esc(a.sub)}</div></div>${a.kind==='med'?`<button class="btn sm" onclick="giveDose('${a.ref}','${a.id}')">Ya se la di</button>`:a.kind==='bill'?`<button class="btn sm" onclick="payBill('${a.ref}','${a.id}')">Pagado</button>`:a.kind==='item'?`<div style="display:flex;flex-direction:column;gap:6px"><button class="btn sm" onclick="itemToList('${a.ref}','${a.id}')">A la lista</button><button class="btn sm ghost" onclick="boughtItem('${a.ref}','${a.id}')">Ya compré</button></div>`:a.kind==='task'?`<button class="btn sm ghost" onclick="toggleTask('${a.ref}');dismissAlert('${a.id}')">Hecho</button>`:`<button class="btn sm ghost" onclick="dismissAlert('${a.id}')">Ok</button>`}</div>`).join('')}
 <div class="stats">
  <div class="stat"><b>${nEv}</b><span class="small muted">compromisos</span></div>
  <div class="stat"><b>${nMed}</b><span class="small muted">dosis por dar</span></div>
  <div class="stat"><b>${S.tasks.filter(t=>!t.done).length}</b><span class="small muted">pendientes</span></div>
 </div>
 <div class="sect"><h2>Tu día</h2><button class="btn sm soft" onclick="go('agenda')">Ver agenda</button></div>
 <div class="card">${items.length?`<ul class="tl">${items.map((i,ix)=>tlItem(i,ix===nextIdx)).join('')}</ul>`:`<div class="empty">Nada para hoy todavía. Escríbele a Lía y ella lo ordena.</div>`}</div>
 ${act.length?`<div class="sect"><h2>Medicamentos activos</h2></div>${act.map(medCard).join('')}`:''}
 ${(()=>{const lim=ymd(addDays(new Date(),7));const up=S.bills.filter(b=>b.due<=lim).sort((a,b)=>a.due.localeCompare(b.due));return up.length?`<div class="sect"><h2>Pagos de la semana</h2><button class="btn sm soft" onclick="foodSeg='gastos';go('comidas')">Ver gastos</button></div><div class="card"><ul class="tl">${up.map(b=>`<li><div class="b"><div class="ttl">${esc(b.name)} · ${bs(b.amount)}</div><span class="small muted">${cap(billDueTxt(b))}</span></div><button class="btn sm ghost" onclick="payBill('${b.id}')">Pagado</button></li>`).join('')}</ul></div>`:''})()}
 ${(()=>{ensureMenu();const md=menuDay(ds);if(!md)return '';return `<div class="sect"><h2>🍲 Menú de hoy</h2><button class="btn sm soft" onclick="foodSeg='menu';go('comidas')">Ver semana y mes</button></div><div class="card"><ul class="tl">${SLOTS.filter(x=>['desayuno','almuerzo','cena'].includes(x[0])).map(([id,lab,time])=>{const r=RECBY[md[id]];return r?`<li><div class="t">${time}</div><div class="b"><div class="ttl">${esc(r.n)}</div><span class="chip c-comida">${lab}</span></div></li>`:''}).join('')}</ul></div>`})()}
 <div class="sect"><h2>Pendientes sin hora</h2><button class="btn sm soft" onclick="addTaskDlg()">+ Agregar</button></div>
 <div class="card">${pend.length?`<ul class="tl">${pend.map(t=>`<li class="${t.done?'done':''}"><button class="check ${t.done?'on':''}" onclick="toggleTask('${t.id}')" aria-label="Marcar">${t.done?IC.ok:''}</button><div class="b"><div class="ttl">${esc(t.text)}</div></div></li>`).join('')}</ul>`:`<div class="empty">Sin pendientes. ¡Bien!</div>`}</div>`;
}
function tlItem(i,isNext){
 const chip={ev:`<span class="chip c-${i.cat}">${esc(i.sub)}</span>`,med:`<span class="chip c-med">${esc(i.sub)}</span>`,meal:`<span class="chip c-comida">${esc(i.sub)}</span>`,task:`<span class="chip c-tarea">Pendiente</span>`}[i.type];
 const btn=i.type==='med'&&!i.done&&isNext?`<button class="btn sm" onclick="giveDose('${i.id}')">Dar</button>`:i.type==='task'?`<button class="check ${i.done?'on':''}" onclick="toggleTask('${i.id}')" aria-label="Marcar">${i.done?IC.ok:''}</button>`:'';
 return `<li class="${i.done?'done':''} ${isNext?'now':''}"><div class="t">${i.time||'—'}</div><div class="b"><div class="ttl">${esc(i.title)}</div>${chip}</div>${btn}</li>`}
function medCard(m){const nx=medNext(m);const tot=m.days?Math.round(m.days*24/m.every):null;const p=tot?Math.min(100,Math.round(m.given.length/tot*100)):Math.min(100,m.given.length*10);
 return `<div class="card med"><div class="ring" style="--p:${p}"><span>${tot?m.given.length+'/'+tot:m.given.length}</span></div><div style="flex:1;min-width:0"><b>${esc(m.name)}${m.dose?' · '+esc(m.dose):''}</b><div class="small muted">Cada ${m.every} h${m.days?' · '+m.days+' días':''}${m.forKid&&kidName(kidOf(m))?' · '+esc(kidName(kidOf(m))):''}</div><div class="small"><b style="color:var(--sage)">Próxima: ${hm(new Date(nx))}</b> <span class="muted">(${rel(nx)})</span></div></div><div style="display:flex;flex-direction:column;gap:6px"><button class="btn sm" onclick="giveDose('${m.id}')">Dar</button><button class="btn sm ghost" onclick="stopMed('${m.id}')">Terminar</button></div></div>`}
function stopMed(id){confirmInline('¿Terminar este tratamiento? Se quita de tu día.',()=>{const m=S.meds.find(x=>x.id===id);if(m){m.stopped=true;S.health.push({id:uid(),ts:Date.now(),type:'nota',text:'Terminó '+m.name})}save();render()})}
function toggleTask(id){const t=S.tasks.find(x=>x.id===id);if(t){t.done=!t.done;save();render()}}
function quickAsk(){const v=$('#qa').value.trim();if(!v)return;S.tab='lia';talk(v)}

function vAgenda(){
 const ws=weekStart(fromYmd(selDay));const today=ymd(new Date());
 const days=[...Array(7)].map((_,i)=>addDays(ws,i));
 const items=dayItems(selDay).filter(i=>i.type!=='meal');
 const up=[];for(let i=1;i<=30&&up.length<5;i++){const d=ymd(addDays(new Date(),i));for(const e of eventsOn(d))if(!e.recur&&up.length<5)up.push({d,e})}
 return `<div class="row between"><h1 style="font-size:24px">Agenda</h1><div class="row"><button class="iconbtn" onclick="shiftWeek(-7)" aria-label="Semana anterior">‹</button><button class="iconbtn" onclick="shiftWeek(7)" aria-label="Semana siguiente">›</button></div></div>
 <div class="muted small" style="margin-top:2px">${MON[ws.getMonth()].replace(/^./,c=>c.toUpperCase())} ${ws.getFullYear()}</div>
 <div class="week">${days.map(d=>{const s=ymd(d);const has=eventsOn(s).length||S.meds.some(m=>medDosesOn(m,s).length);return `<button class="${s===selDay?'on':''} ${s===today?'today':''}" onclick="selDay='${s}';render()">${DSH[d.getDay()]}<b>${d.getDate()}</b>${has?'<i></i>':''}</button>`}).join('')}</div>
 <div class="sect" style="margin-top:4px"><h2>${fmtDate(fromYmd(selDay))}</h2></div>
 <div class="card">${items.length?`<ul class="tl">${items.map(i=>`<li class="${i.done?'done':''}"><div class="t">${i.time||'—'}</div><div class="b"><div class="ttl">${esc(i.title)}</div><span class="chip ${i.type==='med'?'c-med':i.type==='task'?'c-tarea':'c-'+i.cat}">${esc(i.sub)}</span></div>${i.type==='ev'?`<button class="btn sm ghost" onclick="delEvent('${i.id}')" aria-label="Borrar">✕</button>`:''}</li>`).join('')}</ul>`:'<div class="empty">Día libre.</div>'}</div>
 <div class="sect"><h2>Próximas citas</h2></div>
 <div class="card">${up.length?`<ul class="tl">${up.map(({d,e})=>`<li><div class="t" style="width:62px;font-size:13px">${DSH[fromYmd(d).getDay()]} ${fromYmd(d).getDate()}</div><div class="b"><div class="ttl">${esc(e.title)}</div><span class="chip c-${e.cat}">${e.time||'Sin hora'}</span></div></li>`).join('')}</ul>`:'<div class="empty">No hay citas próximas.</div>'}</div>
 <div class="sect"><h2>Clases y rutinas</h2></div>
 <div class="card">${S.events.filter(e=>e.recur).length?`<ul class="tl">${S.events.filter(e=>e.recur).map(e=>`<li><div class="b"><div class="ttl">${esc(e.title)}</div><span class="chip c-${e.cat}">${e.recur.map(i=>DSH[i]).join(', ')}${e.time?' · '+e.time+(e.end?'–'+e.end:''):''}</span></div><button class="btn sm ghost" onclick="delEvent('${e.id}')" aria-label="Borrar">✕</button></li>`).join('')}</ul>`:'<div class="empty">Dile a Lía: "natación los martes y jueves a las 16:00".</div>'}</div>
 <button class="btn fab" onclick="addEventDlg()">+ Nueva cita</button>`}
function shiftWeek(n){selDay=ymd(addDays(fromYmd(selDay),n));render()}
function delEvent(id){if(!confirmInline('¿Borrar este compromiso?',()=>{S.events=S.events.filter(e=>e.id!==id);save();render()}))return}

function vLia(){
 const msgs=S.chat.slice(-60);
 const sug=[`Cita con el pediatra el jueves a las 10`,`Natación los martes y jueves a las 16`,`Compré verduras y frutas, 45 Bs`,`Se acabó la leche y los pañales`,`${S.profile.kid||'La niña'} tiene fiebre 38.5, paracetamol 5 ml cada 6 h por 3 días`,`Recuérdame pagar la luz mañana`,`Pre kínder 1800 Bs cada mes el día 5`,`Pagué el internet 150 Bs`,`Guarda lugar: parque con juegos para bebés`,`¿Cómo voy esta semana?`,`Tope de comida 1200 Bs al mes`,`La crema de Sofi le dura 2 meses, cuesta 330 Bs`,`No le gustó el brócoli`,`Cumpleaños de la abuela el 30 de noviembre`];
 return `<div class="chatwrap"><div class="msgs">
 <div class="lia-row"><div class="av hi" onclick="liaHello()" role="button" aria-label="Saludar a Lía" style="cursor:pointer">${LIA}</div><div class="msg lia">Hola, ${esc(S.profile.mom)}. Soy Lía 🌱 Escríbeme o díctame como te salga, todo junto si quieres, y yo lo ordeno en tu agenda, medicamentos, menú, compras y gastos. Pídeme "¿cómo voy esta semana?" y te doy tu resumen.</div></div>
 ${msgs.map(m=>m.from==='me'?`<div class="msg me">${m.img?`<img class="mimg" src="${m.img}" alt="Foto">`:''}${esc(m.text)}</div>`:m.typing?`<div class="lia-row"><div class="av hi">${LIA}</div><div class="msg lia typing" aria-label="Lía está pensando"><span></span><span></span><span></span><em class="slow">Sigo pensando, un momentito…</em></div></div>`:`<div class="lia-row"><div class="av">${LIA}</div><div class="msg lia${m.guia?' guia':''}">${m.guia?'<div class="gtag">🩺 Guía para mamá</div>':''}${fmt(m.text)}${m.guia?`<div class="gnote">Es una guía general para que estés tranquila y llegues preparada: quien confirma qué tiene es el pediatra.</div>${(m.fuentes||[]).length?`<div class="gsrc">Fuentes: ${m.fuentes.map(f=>`<a href="${esc(f.url)}" target="_blank" rel="noopener">${esc(f.titulo)}</a>`).join(' · ')}</div>`:''}`:''}${m.cards&&m.cards.length?`<div class="org">${m.cards.map(c=>`<div class="it"><span class="chip ${c.cls}">${esc(c.label)}</span><span>${esc(c.detail)}</span></div>`).join('')}</div>`:''}${m.extra?`<div class="small muted" style="margin-top:8px">${esc(m.extra)}</div>`:''}${m.tms?`<div class="tiny muted" style="margin-top:6px;opacity:.7">⏱ ${(m.tms/1000).toFixed(1).replace('.',',')} s${m.tia?' · IA '+(m.tia/1000).toFixed(1).replace('.',','):''}</div>`:''}${m.retry?`<button class="undo" onclick="retryVoice('${m.id}')">🔁 Reintentar</button>`:''}${m.undone?'<div class="tiny muted" style="margin-top:6px">(Deshecho)</div>':m.undo?`<button class="undo" onclick="undoMsg('${m.id}')">Deshacer</button>`:''}</div></div>`).join('')}
 </div>
 <div class="composer"><div class="sugs">${sug.map(s=>`<button onclick="sendChat(this.textContent)">${esc(s)}</button>`).join('')}</div>
 ${imgBox()}<form class="ask" onsubmit="event.preventDefault();sendChat()"><button type="button" class="cam" onclick="pickImg()" aria-label="Adjuntar foto">${IC.cam}</button><input id="ci" placeholder="${pendImg?'Cuéntale qué te preocupa de la foto…':'Escribe o mantén 🎤 para hablar'}" autocomplete="off">${micBtn('ci')}<button aria-label="Enviar">${IC.send}</button></form>
 <div class="tiny muted" style="text-align:center;margin-top:4px">${aiCode()?'<span class="aibadge">✨ Lía con IA</span> Mantén apretado 🎤 para hablar, suelta para enviar. Un toque: graba manos libres.':'Lía básica: entiende frases comunes. <a href="#" onclick="askCode();return false" style="color:var(--accent);font-weight:600">Activar Lía con IA</a>'}</div></div></div>`}
function sendChat(t){const v=(t||$('#ci').value).trim();if(!v&&!pendImg)return;talk(v||'📷 Mira esta foto')}


function kidTabs(){const ks=kids();if(ks.length<2)return '';return `<div class="seg" style="margin:6px 0 4px">${ks.map(k=>`<button class="${k.id===activeKid().id?'on':''}" onclick="setKid('${k.id}')">${esc(k.name||'Peque')}</button>`).join('')}</div>`}
function vSalud(){syncKid();const kid=activeKid().id;const mine=x=>kidOf(x)===kid;
 const act=S.meds.filter(m=>medActive(m)&&mine(m));const past=S.meds.filter(m=>!medActive(m)&&mine(m));
 const log=[...S.health].filter(mine).sort((a,b)=>b.ts-a.ts).slice(0,25);
 return `<h1 style="font-size:24px">Salud${S.profile.kid?' de '+esc(S.profile.kid):''}</h1>${kidTabs()}${S.profile.cond?`<div class="note" style="margin-top:8px"><b>Cuidado especial:</b> ${esc(S.profile.cond)}. Lía lo tiene en cuenta en sus guías. <a href="#" onclick="openSettings();return false" style="color:var(--accent)">Cambiar</a></div>`:`<div class="tiny muted" style="margin:4px 0 8px">¿Tiene alguna condición o cuidado especial (autismo, síndrome de Down, asma…)? <a href="#" onclick="openSettings();return false" style="color:var(--accent)">Anótala en Ajustes</a> y Lía la tendrá en cuenta.</div>`}
 <div class="muted small" style="margin:2px 0 12px">${ageText()}${(S.profile.allergies||[]).length?' · Alergias: '+S.profile.allergies.map(a=>ALLERG.find(x=>x[0]===a)[1]).join(', '):''}</div>
 <div class="note"><b>Importante:</b> esta app no calcula dosis ni diagnostica. Anota la dosis que indicó el pediatra y consulta ante cualquier duda.</div>
 <div class="row" style="gap:8px;margin-bottom:6px"><button class="btn block" onclick="addMedDlg()">+ Medicamento</button><button class="btn ghost block" onclick="addTempDlg()">Anotar temperatura</button></div>
 <div class="sect"><h2>Tratamientos activos</h2></div>
 ${act.length?act.map(medCard).join(''):'<div class="card empty">Ningún tratamiento activo.</div>'}
 ${past.length?`<div class="sect"><h2>Terminados</h2></div><div class="card"><ul class="tl">${past.map(m=>`<li><div class="b"><div class="ttl">${esc(m.name)} ${esc(m.dose)}</div><div class="small muted">${m.given.length} dosis · inició ${new Date(m.start).toLocaleDateString('es-BO')}</div></div></li>`).join('')}</ul></div>`:''}
 <div class="sect"><h2>Historial</h2></div>
 <div class="card">${log.length?`<ul class="tl">${log.map(h=>`<li><div class="t" style="width:70px;font-size:12.5px;font-weight:700">${new Date(h.ts).toLocaleDateString('es-BO',{day:'numeric',month:'short'})}<br>${hm(new Date(h.ts))}</div><div class="b"><div class="ttl">${esc(h.text)}</div></div></li>`).join('')}</ul>`:'<div class="empty">Aquí se guardan fiebres, síntomas y dosis dadas, para mostrarle al pediatra.</div>'}</div>
 <div class="danger-note"><b>Ve a emergencias</b> si tiene dificultad para respirar, convulsiones, está muy decaída o no despierta bien, no toma líquidos, o tiene manchas en la piel que no desaparecen al presionarlas.</div>`}

function vComidas(){
 ensureMenu();
 if(foodSeg==='despensa')foodSeg='gastos';
 const sb=(id,l)=>`<button class="${foodSeg===id?'on':''}" onclick="foodSeg='${id}';render()">${l}</button>`;
 return `<h1 style="font-size:24px">Menú y casa</h1>
 <div class="seg">${sb('menu','Menú')}${sb('mes','Mes')}${sb('compras','Compras')}${sb('precios','Precios')}${sb('gastos','Gastos')}${sb('lugares','Lugares')}</div>
 ${foodSeg==='menu'?vMenu():foodSeg==='mes'?vMes():foodSeg==='precios'?vPrecios():foodSeg==='compras'?vCompras():foodSeg==='gastos'?vGastos():vLugares()}`}
function vGastos(){
 const now=Date.now(),ms=monthStart(),ws=weekStart().getTime();const mon=spentBetween(ms,now+1),tw=spentBetween(ws,now+1),lw=spentBetween(ws-7*864e5,ws);
 const mb=Number(S.profile.mbudget)||0;const fixed=S.bills.reduce((a,b)=>a+perMonthly(b),0);
 const byC={};for(const m of moves())if(m.ts>=ms)byC[m.cat]=(byC[m.cat]||0)+m.amount;const cats=Object.entries(byC).sort((a,b)=>b[1]-a[1]);const max=cats.length?cats[0][1]:1;
 const bills=[...S.bills].sort((a,b)=>a.due.localeCompare(b.due));const mv=moves().slice(0,15);const today=ymd(new Date());
 return `<div class="card"><div class="row between"><b>Gastado este mes</b><button class="btn sm ghost" onclick="mbudgetDlg()">Presupuesto</button></div>
 <div style="font-size:26px;font-weight:800;margin-top:4px">${bs(mon)}</div>
 ${mb?`<div class="bar ${mon>mb?'over':''}"><i style="width:${Math.min(100,mon/mb*100)}%"></i></div><div class="small muted">de ${bs(mb)} · te quedan ${bs(Math.max(0,mb-mon))}</div>`:'<div class="small muted">Ponle un presupuesto mensual para ver cuánto te queda.</div>'}
 ${fixed?`<div class="small" style="margin-top:6px">Pagos fijos y periódicos: <b>${bs(fixed)}</b> al mes en promedio</div>`:''}</div>
 <div class="card" style="background:var(--surface2)"><div class="row between"><b>Informe de la semana</b><button class="btn sm soft" onclick="S.chat.push({id:uid(),from:'me',text:'¿Cómo voy esta semana?',ts:Date.now()});liaReply('informe');go('lia')">Pedírselo a Lía</button></div>
 <div class="row" style="gap:16px;margin-top:8px"><div><div class="tiny muted">Esta semana</div><b style="font-size:19px">${bs(tw)}</b></div><div><div class="tiny muted">Semana pasada</div><b style="font-size:19px;color:var(--sub)">${bs(lw)}</b></div></div>
 ${lw?`<div class="small" style="margin-top:6px;color:${tw>lw?'var(--danger)':'var(--sage)'}">${tw>lw?'Vas '+bs(tw-lw)+' más arriba que la semana pasada.':'Vas '+bs(lw-tw)+' por debajo de la semana pasada. ¡Bien!'}</div>`:''}</div>
 ${(()=>{const byW={};for(const m of moves())if(m.ts>=ms)byW[m.who]=(byW[m.who]||0)+m.amount;const fixW={};for(const b of S.bills)fixW[b.who||'Familia']=(fixW[b.who||'Familia']||0)+perMonthly(b);const ws2=members().filter(w=>byW[w]||fixW[w]);return ws2.length?`<div class="sect"><h2>Por persona</h2></div><div class="card"><ul class="tl">${ws2.map(w=>`<li><div class="b"><div class="ttl">${esc(w)}</div><div class="small muted">Este mes ${bs(byW[w]||0)} · fijos ${bs(fixW[w]||0)} al mes</div></div></li>`).join('')}</ul></div>`:''})()}
 <div class="sect"><h2>Por categoría (este mes)</h2><button class="btn sm soft" onclick="capsDlg()">Topes</button></div>
 ${(()=>{for(const c of Object.keys(S.caps))if(!cats.some(x=>x[0]===c))cats.push([c,0]);return ''})()}
 <div class="card">${cats.length?cats.map(([k,v])=>{const cap=S.caps[k];const pc=cap?v/cap*100:v/max*100;const col=cap?(pc>=100?'var(--danger)':pc>=80?'var(--sun)':'var(--sage)'):'var(--accent)';return `<div style="margin:8px 0"><div class="row between small"><span>${GCAT.find(g=>g[0]===k)[2]} ${GNAME[k]}</span><b>${bs(v)}${cap?` <span class="muted" style="font-weight:600">de ${bs(cap)}</span>`:''}</b></div><div class="bar" style="margin:4px 0 0;height:8px"><i style="width:${Math.min(100,pc)}%;background:${col}"></i></div>${cap&&pc>=80?`<div class="tiny" style="color:${col};margin-top:2px">${pc>=100?'Pasaste tu tope del mes':'Usaste el '+Math.round(pc)+'% de tu tope'}</div>`:''}</div>`}).join(''):'<div class="empty">Dile a Lía: "pagué la luz 120 Bs" o "gasté 30 Bs en pasajes".</div>'}</div>
 <div class="sect"><h2>Pagos fijos y periódicos</h2><button class="btn sm soft" onclick="billDlg()">+ Agregar</button></div>
 <div class="card">${bills.length?`<ul class="tl">${bills.map(b=>`<li><div class="b"><div class="ttl">${esc(b.name)} · ${bs(b.amount)}</div><span class="chip ${b.due<=today?'c-mama':'c-tarea'}">${cap(billDueTxt(b))}</span> <span class="tiny muted">${PER[b.per][0]} · ${esc(b.who||'Familia')}</span></div><button class="btn sm" onclick="payBill('${b.id}')">Pagado</button><button class="p" style="border:0;background:transparent;color:var(--sub)" onclick="delBill('${b.id}')" aria-label="Quitar">✕</button></li>`).join('')}</ul>`:'<div class="empty">Pre kínder, internet, expensas, pediatra cada 3 meses… Dile a Lía: "pre kínder 1800 Bs cada mes el día 5".</div>'}</div>
 <div class="sect"><h2>Movimientos</h2><button class="btn sm soft" onclick="expDlg()">+ Gasto</button></div>
 <div class="card">${mv.length?`<ul class="tl">${mv.map(m=>`<li><div class="t" style="width:58px;font-size:12.5px">${new Date(m.ts).toLocaleDateString('es-BO',{day:'numeric',month:'short'})}</div><div class="b"><div class="ttl">${esc(m.text)}</div><span class="tiny muted">${GNAME[m.cat]} · ${esc(m.who)}</span></div><b class="small">${bs(m.amount)}</b></li>`).join('')}</ul>`:'<div class="empty">Aún no hay gastos.</div>'}</div>
 ${vDespensa(true)}`}

function avEv(e){const mom=S.profile.mom||'';const min=e.remind||30;const k=e.who==='kid'?kidName(kidOf(e)):'';
 return {t:(mom?mom+', ':'')+falta(min),b:e.title+' · a las '+e.time,s:(mom?mom+', ':'')+falta(min)+' para '+e.title.charAt(0).toLowerCase()+e.title.slice(1)+(k&&!norm(e.title).includes(norm(k))?', con '+k:'')+'.'}}
function avEvNow(e){const mom=S.profile.mom||'';const k=e.who==='kid'?kidName(kidOf(e)):'';return {t:(mom?mom+', ':'')+'es la hora',b:e.title+' · '+e.time,s:(mom?mom+', ':'')+'ya es hora: '+e.title.charAt(0).toLowerCase()+e.title.slice(1)+(k&&!norm(e.title).includes(norm(k))?', con '+k:'')+'. No lo olvides.'}}
function avMed(m,nx){const mom=S.profile.mom||'';const k=kidName(kidOf(m));
 return {t:(mom?mom+', ':'')+'hora del '+m.name,b:(m.dose?m.dose+' · ':'')+(k?'para '+k+' · ':'')+'dosis de las '+hm(new Date(nx)),s:(mom?mom+', ':'')+'es hora de darle '+m.name+(m.dose?', '+m.dose:'')+(k?', a '+k:'')+'.'}}
function avTask(t){const mom=S.profile.mom||'';return {t:(mom?mom+', ':'')+'recuerda',b:t.text,s:(mom?mom+', ':'')+'te recuerdo: '+t.text+'.'}}
function avBill(b){const mom=S.profile.mom||'';return {t:(mom?mom+', ':'')+'mañana toca pagar',b:b.name+' · '+bs(b.amount),s:(mom?mom+', ':'')+'mañana toca pagar '+b.name+', '+bs(b.amount)+'.'}}
function futureAlerts(){const now=Date.now(),out=[];const lim=now+8*864e5;
 for(let d=0;d<8;d++){const ds=ymd(addDays(new Date(),d));for(const e of eventsOn(ds)){if(!e.time)continue;const t=at(ds,e.time).getTime();const r=t-(e.remind||30)*60000;if(t<now-60000)continue;
  if(r>now-60000)out.push(Object.assign({id:'ev:'+e.id+':'+ds,at:r},avEv(e)));out.push(Object.assign({id:'evh:'+e.id+':'+ds,at:t},avEvNow(e)))}}
 for(const m of S.meds){if(!medActive(m))continue;let nx=medNext(m);const end=medEnd(m);let n=0;while(nx&&nx<lim&&nx<end&&n<20){if(nx>now-60000)out.push(Object.assign({id:'med:'+m.id+':'+nx,at:nx},avMed(m,nx)));nx+=m.every*36e5;n++}}
 for(const t of S.tasks){if(t.done||!t.due||t.due<now-60000||t.due>lim)continue;out.push(Object.assign({id:'tk:'+t.id,at:t.due},avTask(t)))}
 for(const b of S.bills){const d=fromYmd(b.due);d.setHours(9,0,0,0);const a=d.getTime()-864e5;if(a>now-60000&&a<lim)out.push(Object.assign({id:'bill:'+b.id+':'+b.due,at:a},avBill(b)))}
 return out.sort((a,b)=>a.at-b.at).slice(0,120)}
let pushKey=null;
async function pushSub(create){if(!('serviceWorker' in navigator)||!('PushManager' in window)||!('Notification' in window)||Notification.permission!=='granted')return null;
 const reg=await navigator.serviceWorker.ready;let sub=await reg.pushManager.getSubscription();if(sub||!create&&!localStorage.getItem('md-push'))return sub;
 if(!pushKey){const r=await fetch('/api/avisos?clave=1');pushKey=(await r.json()).clave}
 const raw=atob(pushKey.replace(/-/g,'+').replace(/_/g,'/')+'='.repeat((4-pushKey.length%4)%4));const key=new Uint8Array([...raw].map(c=>c.charCodeAt(0)));
 sub=await reg.pushManager.subscribe({userVisibleOnly:true,applicationServerKey:key});return sub}
async function pushSync(create){try{if(!S||!S.profile||!S.profile.mom)return false;const sub=await pushSub(create);if(!sub)return false;
 const av=futureAlerts();const h=JSON.stringify(av.map(a=>a.id+a.at+a.b))+sub.endpoint;let last={};try{last=JSON.parse(localStorage.getItem('md-push')||'{}')}catch(e){}
 if(last.h===h&&Date.now()-(last.t||0)<12*36e5)return true;
 const r=await fetch('/api/avisos',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({modo:'sync',sub:sub.toJSON(),avisos:av})});
 if(r.ok){try{localStorage.setItem('md-push',JSON.stringify({h,t:Date.now()}))}catch(e){}return true}return false}catch(e){return false}}
async function pushTest(){try{const sub=await pushSub(true);if(!sub){toast('Primero activa los avisos');return}await fetch('/api/avisos',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({modo:'prueba',sub:sub.toJSON()})});toast('Te mandé un aviso de prueba')}catch(e){toast('No pude enviar la prueba')}}

function installBanner(w){if(standalone())return '';if(!deferredPrompt&&!isIOS())return '';
 return `<div class="install"><img src="icon-192.png" alt="" style="width:36px;height:36px;border-radius:9px"><div class="b"><b>Instálala como app</b><br>${isIOS()?'En Safari toca Compartir y luego "Agregar a inicio".':'Queda en tu pantalla de inicio y te avisa.'}</div>${deferredPrompt?'<button class="btn sm" onclick="doInstall()">Instalar</button>':''}</div>`}
